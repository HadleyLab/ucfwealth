                  - value:
                      Coding:
                        code: "1"
                        display: pM0
                  - value:
                      Coding:
                        code: "2"
                        display: pM1
                  - value:
                      Coding:
                        code: "999"
                        display: Unknown
              - text: 12. Size of invasive tumor
                type: decimal
                linkId: invasiveTumorSize
                unit:
                  code: mm
                  system: http://unitsofmeasure.org
                  display: mm
              - text: 13. Number of lymph nodes resected
                type: integer
                linkId: lymphNodesResected
              - text: 14. Number of lymph nodes involved
                type: integer
                linkId: lymphNodesInvolved
              - text: 15. Estrogen receptor status
                type: choice
                linkId: estrogenReceptorStatus
                itemControl:
                  coding:
                    - code: inline-choice
                answerOption:
                  - value:
                      Coding:
                        code: "0"
