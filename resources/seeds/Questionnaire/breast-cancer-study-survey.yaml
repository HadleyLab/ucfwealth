id: breast-cancer-study-survey
resourceType: Questionnaire
name: breast-cancer-study-survey
title: Breast Cancer Study Survey
status: active
launchContext:
  - name:
      code: Patient
    type:
      - Patient
mapping:
  - id: brest-cancer-study-survey-extract
    resourceType: Mapping
item:
  - type: group
    linkId: wizard
    itemControl:
      coding:
        - code: wizard
    item:
      - linkId: demographic-factors-group
        text: Demographic factors
        type: group
        item:
          - text: PatientID
            type: string
            linkId: patient-id
            hidden: true
            required: true
            initialExpression:
              language: text/fhirpath
              expression: "%Patient.id"
          - text: "1. Please indicate your sex:"
            type: choice
            linkId: sex
            itemControl:
              coding:
                - code: inline-choice
            inlineChoiceDirection: horizontal
            answerOption:
              - value:
                  Coding:
                    code: "1"
                    display: Male
              - value:
                  Coding:
                    code: "2"
                    display: Female
          - text: 2. What is your date of birth? DD/MM/YYYY
            type: date
            linkId: dateOfBirth
            initialExpression:
              language: text/fhirpath
              expression: "%Patient.birthDate"
          - text: 3. What is your country of residence?
            type: string
            linkId: countryOfResidence
          - text: 4. What is your ethnicity?
            type: choice
            linkId: ethnicity
            answerValueSet: http://terminology.hl7.org/ValueSet/v3-Ethnicity
          - text: 5. Please indicate the highest level of schooling completed.
            type: choice
            linkId: schoolingCompleted
            itemControl:
              coding:
                - code: inline-choice
            answerOption:
              - value:
                  Coding:
                    code: "0"
                    display: None
              - value:
                  Coding:
                    code: "1"
                    system: ""
                    display: Primary
              - value:
                  Coding:
                    code: "2"
                    system: ""
                    display: Secondary
              - value:
                  Coding:
                    code: "3"
                    system: ""
                    display: Tertiary
          - text: 6. What is your relationship status?
            type: choice
            linkId: relationshipStatus
            itemControl:
              coding:
                - code: inline-choice
            answerOption:
              - value:
                  Coding:
                    code: "0"
                    display: Never married/partnered
              - value:
                  Coding:
                    code: "1"
                    system: ""
                    display: Married/partnered
              - value:
                  Coding:
                    code: "2"
                    system: ""
                    display: Divorced/separated
              - value:
                  Coding:
                    code: "3"
                    system: ""
                    display: Widowed
          - text: 7. What is your current menopausal status?
            type: choice
            linkId: menopausalStatus
            itemControl:
              coding:
                - code: inline-choice
            answerOption:
              - value:
                  Coding:
                    code: "0"
                    display: Pre-menopause
              - value:
                  Coding:
                    code: "1"
                    system: ""
                    display: Post-menopause (natural/surgical)
              - value:
                  Coding:
                    code: "3"
                    system: ""
                    display: I don't know
      - text: Baseline clinical factors
        type: group
        linkId: baselineClinicalFactors
        item:
          - text: >-
              1. Have you been told by a doctor that you have any of the following?
            type: choice
            linkId: diseases
            helpText: Select all that apply
            repeats: true
            answerOption:
              - value:
                  Coding:
                    code: "0"
                    display: I have no other diseases
              - value:
                  Coding:
                    code: "1"
                    display: Heart disease
              - value:
                  Coding:
                    code: "2"
                    display: High blood pressure
              - value:
                  Coding:
                    code: "3"
                    display: Leg pain when walking due to poor circulation
              - value:
                  Coding:
                    code: "4"
                    display: Lung disease
              - value:
                  Coding:
                    code: "5"
                    display: Diabetes
              - value:
                  Coding:
                    code: "6"
                    display: Kidney disease
              - value:
                  Coding:
                    code: "7"
                    display: Liver disease
              - value:
                  Coding:
                    code: "8"
                    display: Problems caused by stroke
              - value:
                  Coding:
                    code: "9"
                    display: Disease of the nervous system
              - value:
                  Coding:
                    code: "10"
                    display: Other cancer (within the last 5 years)
              - value:
                  Coding:
                    code: "11"
                    display: Depression
              - value:
                  Coding:
                    code: "12"
                    display: Arthritis
          - text: >-
              2. What is your height?
            type: string
            linkId: height
            helpText: "For example: 5 ft and 5 inches"
          - text: 3. What is your weight?
            type: decimal
            linkId: weight
            unit:
              code: lb
              system: http://unitsofmeasure.org
              display: lbs
          - text: 4. Indicate the laterality of breast cancer
            type: choice
            linkId: laterality
            itemControl:
              coding:
                - code: inline-choice
            answerOption:
              - value:
                  Coding:
                    code: "0"
                    display: Left breast
              - value:
                  Coding:
                    code: "1"
                    display: Right breast
              - value:
                  Coding:
                    code: "2"
                    display: Both breasts
              - value:
                  Coding:
                    code: "3"
                    display: No diagnosis of breast cancer
          - text: >-
              5. Indicate if this is first breast cancer or new cancer on
              contralateral or ipsilateral breast:
            type: choice
            linkId: cancerHistory
            itemControl:
              coding:
                - code: inline-choice
            answerOption:
              - value:
                  Coding:
                    code: "0"
                    display: Primary tumor
              - value:
                  Coding:
                    code: "1"
                    display: New ipsilateral
              - value:
                  Coding:
                    code: "2"
                    display: New contralateral
              - value:
                  Coding:
                    code: "3"
                    display: No diagnosis of breast cancer
      - text: Baseline tumor factors
        type: group
        linkId: baselineTumorFactors
        item:
          - text: Have you been diagnosed with breast cancer?
            type: choice
            linkId: patientHasDiagnosisOfBreastCancer
            itemControl:
              coding:
                - code: inline-choice
            inlineChoiceDirection: horizontal
            answerOption:
              - value:
                  Coding:
                    code: "no"
                    display: "No"
              - value:
                  Coding:
                    code: "yes"
                    display: "Yes"
          - text: If you have never been diagnosed with breast cancer, please proceed to the next page.
            type: display
            linkId: patientHasNotDiagnosisOfBreastCancerDescription
            enableWhen:
              - question: patientHasDiagnosisOfBreastCancer
                operator: "="
                answer:
                  Coding:
                    code: "no"
          - linkId: patientHasDiagnosisOfBreastCancerGroup1
            type: group
            enableWhen:
              - question: patientHasDiagnosisOfBreastCancer
                operator: "="
                answer:
                  Coding:
                    code: "yes"
            item:
              - text: If you have been diagnosed with breast, please complete the questions below.
                linkId: instruction-1
                type: display
              - text: 1. Initial date of histological diagnosis DD/MM/YYYY
                type: date
                linkId: initialDiagnosisDate
              - text: "2. Indicate histologic type of the tumor:"
                type: choice
                linkId: histologicType
                helpText: Select all that apply
                repeats: true
                itemControl:
                  coding:
                    - code: inline-choice
                answerOption:
                  - value:
                      Coding:
                        code: "0"
                        display: Ductal carcinoma in situ
                  - value:
                      Coding:
                        code: "1"
                        display: Invasive ductal carcinoma
                  - value:
                      Coding:
                        code: "2"
                        display: Invasive lobular carcinoma
                  - value:
                      Coding:
                        code: "3"
                        display: Other
                  - value:
                      Coding:
                        code: "999"
                        display: Unknown
              - text: Specify other histologic type
                type: string
                linkId: otherHistologicType
                enableWhen:
                  - question: histologicType
                    operator: "="
                    answer:
                      Coding:
                        code: "3"
              - text: >-
                  3. Indicate if the patient carries a genetic mutation predisposing
                  breast cancer:
                type: choice
                linkId: geneticMutation
                itemControl:
                  coding:
                    - code: inline-choice
                answerOption:
                  - value:
                      Coding:
                        code: "0"
                        display: No mutation
                  - value:
                      Coding:
                        code: "1"
                        display: BRCA1
                  - value:
                      Coding:
                        code: "2"
                        display: BRCA2
                  - value:
                      Coding:
                        code: "3"
                        display: Other mutation
                  - value:
                      Coding:
                        code: "4"
                        display: Not tested
              - text: "4. Indicate grade of invasive component of tumor:"
                type: choice
                linkId: invasiveComponentGrade
                itemControl:
                  coding:
                    - code: inline-choice
                answerOption:
                  - value:
                      Coding:
                        code: "0"
                        display: Grade 1
                  - value:
                      Coding:
                        code: "1"
                        display: Grade 2
                  - value:
                      Coding:
                        code: "2"
                        display: Grade 3
                  - value:
                      Coding:
                        code: "3"
                        display: Not reported
              - text: 5. Indicate tumor grade of DCIS component of tumor
                type: choice
                linkId: dcisComponentGrade
                itemControl:
                  coding:
                    - code: inline-choice
                answerOption:
                  - value:
                      Coding:
                        code: "0"
                        display: Low
                  - value:
                      Coding:
                        code: "1"
                        display: Intermediate
                  - value:
                      Coding:
                        code: "2"
                        display: High
                  - value:
                      Coding:
                        code: "3"
                        display: Not reported
              - text: 6. Clinical tumor stage
                type: choice
                linkId: clinicalTumorStage
                answerOption:
                  - value:
                      Coding:
                        code: "0"
                        display: cTX
                  - value:
                      Coding:
                        code: "1"
                        display: cT0
                  - value:
                      Coding:
                        code: "2"
                        display: cTis
                  - value:
                      Coding:
                        code: "3"
                        display: cT1
                  - value:
                      Coding:
                        code: "4"
                        display: cT2
                  - value:
                      Coding:
                        code: "5"
                        display: cT3
                  - value:
