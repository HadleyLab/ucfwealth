                answerOption:
                  - value:
                      Coding:
                        code: "0"
                        display: pTX
                  - value:
                      Coding:
                        code: "1"
                        display: pT0
                  - value:
                      Coding:
                        code: "2"
                        display: pTis
                  - value:
                      Coding:
                        code: "3"
                        display: pT1
                  - value:
                      Coding:
                        code: "4"
                        display: pT2
                  - value:
                      Coding:
                        code: "5"
                        display: pT3
                  - value:
                      Coding:
                        code: "6"
                        display: pT4
                  - value:
                      Coding:
                        code: "999"
                        display: Unknown
              - text: 10. Pathological nodal stage
                type: choice
                linkId: pathologicalNodalStage
                itemControl:
                  coding:
                    - code: inline-choice
                answerOption:
                  - value:
                      Coding:
                        code: "0"
                        display: pNX
                  - value:
                      Coding:
                        code: "1"
                        display: pN0
                  - value:
                      Coding:
                        code: "2"
                        display: pN1
                  - value:
                      Coding:
                        code: "3"
                        display: pN2
                  - value:
                      Coding:
                        code: "4"
                        display: pN3
                  - value:
                      Coding:
                        code: "999"
                        display: Unknown
              - text: 11. Pathological distant metastasis
                type: choice
                linkId: pathologicalDistantMetastasis
                itemControl:
                  coding:
                    - code: inline-choice
                answerOption:
                  - value:
                      Coding:
                        code: "0"
