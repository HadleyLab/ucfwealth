      - text: Degree of health
        type: group
        linkId: degreeOfHealth
        item:
          - text: >-
              1. Do you have any trouble doing strenuous activities, like carrying
              a heavy shopping bag or a suitcase?
            type: choice
            linkId: strenuousActivities
            itemControl:
              coding:
